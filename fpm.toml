name = "research-programs"
version = "0.1.0"
license = "MIT"
author = "Thales Freitas Macedo"
maintainer = "Thales Freitas Macedo"
description = "Programs developed for physics simulations"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[features]
debug.gfortran.flags = "-Og -Wall -Wextra -g -fcheck=all -fbacktrace -llapack -lblas"
release.gfortran.flags = "-O2 -llapack -lblas"

debug.ifort.flags = "-O0 -warn all -traceback -check all -diag-disable=10448 -qmkl"
release.ifort.flags = "-O2 -diag-disable=10448 -qmkl"

[profiles]
default = ["release"]
debug = ["debug"]

[library]
source-dir = "src"

[dependencies]
stdlib = { path = "vendor/stdlib", preprocess.cpp.macros=["STDLIB_EXTERNAL_BLAS", "STDLIB_EXTERNAL_LAPACK"] }

[[test]]
name = "test-lapack-blas"
source-dir = "tests"
main = "test_lapack_blas.f90"